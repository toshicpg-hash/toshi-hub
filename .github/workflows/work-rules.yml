name: Work rules and browser UI

on:
  create:
  push:
    branches: [qa/deadline-task-synthetic-20261011]

permissions:
  contents: read

concurrency:
  group: synthetic-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-ui:
    if: github.ref == 'refs/heads/qa/deadline-task-synthetic-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Unit, compatibility and mocked sync tests
        run: node --test tests/work-rules.test.cjs
      - name: Install pinned browser testing dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile with synthetic data only
        run: node tests/work-rules.browser.cjs
        env:
          SCREENSHOT_DIR: test-screenshots
      - name: Upload synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-ui-screenshots
          path: test-screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore
