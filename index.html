<script>
const GOOGLE_CLIENT_ID="766726293537-1e4kdsqmoit29rbvh559fnmha3q0s6up.apps.googleusercontent.com";
const GOOGLE_SCOPE='https://www.googleapis.com/auth/calendar.readonly';
let googleTokenClient=null,googleAccessToken='';
function initGoogleCalendar(){if(!window.google||!google.accounts||!google.accounts.oauth2){setTimeout(initGoogleCalendar,300);return;}googleTokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:GOOGLE_SCOPE,callback:(resp)=>{if(resp.error){googleStatus.textContent='Google認証エラー: '+resp.error;return;}googleAccessToken=resp.access_token;googleStatus.textContent='Google接続済み';loadGoogleCalendar();}});}
window.addEventListener('load',initGoogleCalendar);
async function loadGoogleCalendar(){
 if(!googleAccessToken){if(googleTokenClient)googleTokenClient.requestAccessToken({prompt:''});else googleStatus.textContent='Google認証を準備中です';return;}
 googleStatus.textContent='5カレンダーを同期中…';
 try{
  const now=new Date(),from=new Date(now.getFullYear(),now.getMonth()-1,1),to=new Date(now.getFullYear(),now.getMonth()+3,1);
  const lr=await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250',{headers:{Authorization:'Bearer '+googleAccessToken}});
  if(!lr.ok)throw new Error('カレンダー一覧 HTTP '+lr.status);
  const lj=await lr.json(),names=['TOSHI','CPG','TASK','Trip','GOLF'];
  const targets=(lj.items||[]).filter(c=>names.includes(c.summary));
  const missing=names.filter(n=>!targets.some(c=>c.summary===n));
  let imported=[];
  for(const c of targets){
   const url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(c.id)+'/events?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin='+encodeURIComponent(from.toISOString())+'&timeMax='+encodeURIComponent(to.toISOString());
   const r=await fetch(url,{headers:{Authorization:'Bearer '+googleAccessToken}});
   if(!r.ok)throw new Error(c.summary+' HTTP '+r.status);
   const j=await r.json();
   imported.push(...(j.items||[]).filter(e=>e.status!=='cancelled').map(e=>{
    const allDay=!!e.start?.date,start=allDay?e.start.date:e.start?.dateTime,end=allDay?e.end?.date:e.end?.dateTime;
    return {title:e.summary||'(タイトルなし)',type:'event',date:allDay?start:(start||'').slice(0,10),time:allDay?'':(start||'').slice(11,16),endTime:allDay?'':(end||'').slice(11,16),allDay,project:c.summary,done:false,source:'google',googleId:e.id,googleCalendarId:c.id,googleUrl:e.htmlLink||'',googleEndDate:allDay?end:''};
   }));
  }
  
  // Google終日予定の終了日は「含まない」仕様。複数日予定を開始日〜終了日前日まで各日に展開する。
  imported=imported.flatMap(x=>{
    if(!x.allDay||!x.googleEndDate)return [x];
    const parse=d=>{const [y,m,dd]=d.split('-').map(Number);return Date.UTC(y,m-1,dd)};
    const fmt=t=>{const d=new Date(t);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`};
    const a=parse(x.date),b=parse(x.googleEndDate);
    if(!(b>a))return [x];
    const out=[];
    for(let t=a;t<b;t+=86400000)out.push({...x,date:fmt(t)});
    return out;
  });

  const local=data.items.filter(x=>x.source!=='google');
  data.items=[...local,...imported];save();
  googleStatus.textContent='同期完了：'+imported.length+'件（複数日展開済）'+(missing.length?'（未検出: '+missing.join(' / ')+'）':'');
 }catch(err){googleStatus.textContent='同期できませんでした：'+err.message;}
}
document.addEventListener('click',e=>{if(e.target?.id==='googleConnect'){if(googleTokenClient)googleTokenClient.requestAccessToken({prompt:'select_account'});else googleStatus.textContent='Google認証を準備中です';}if(e.target?.id==='googleSync')loadGoogleCalendar();});
const N=new Date(), TODAY=`${N.getFullYear()}-${String(N.getMonth()+1).padStart(2,'0')}-${String(N.getDate()).padStart(2,'0')}`;let view=new Date(N.getFullYear(),N.getMonth(),1),selected=TODAY,filter='all',entry='event',calendarMode='week',weekAnchor=new Date(N.getFullYear(),N.getMonth(),N.getDate());let data=JSON.parse(localStorage.getItem('toshi_v5')||'null')||{items:[],money:[]};

}

function render(){let todos=data.items.map((x,i)=>[x,i]).filter(([x])=>x.type==='todo');homeTodo.textContent=todos.filter(([x])=>!x.done).length+'件';let td=data.items.map((x,i)=>[x,i]).filter(([x])=>(x.type==='event'&&x.date===TODAY)||(x.type==='todo'&&x.end===TODAY)).sort((a,b)=>sortTime(a[0],b[0]));homeToday.textContent=td.length+'件';todayRows.innerHTML=td.length?td.map(([x,i])=>itemRow(x,i)).join(''):'<div class="muted">今日の予定はありません</div>';homePay.textContent='¥'+data.money.filter(x=>x.kind==='payment'&&!x.done).reduce((a,x)=>a+Number(x.amount),0).toLocaleString();renderTodos();renderMoney();renderCal();renderGantt()}

function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function startOfWeek(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
function renderCal(){if(calendarMode==='week'){renderWeek();return;}cal.style.display='grid';weekList.style.display='none';selectedCard.style.display='block';monthLabel.textContent=`${view.getFullYear()}年${view.getMonth()+1}月`;let f=new Date(view.getFullYear(),view.getMonth(),1),l=new Date(view.getFullYear(),view.getMonth()+1,0),h=['日','月','火','水','木','金','土'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<f.getDay();i++)h+='<div></div>';for(let d=1;d<=l.getDate();d++){let s=`${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=data.items.some(x=>x.date===s||x.end===s)||data.money.some(x=>x.date===s);h+=`<button class="day ${s===TODAY?'today':''} ${has?'has':''}" data-day="${s}">${d}</button>`}cal.innerHTML=h;showDay(selected)}
function renderWeek(){cal.style.display='none';weekList.style.display='block';selectedCard.style.display='none';let st=startOfWeek(weekAnchor),en=new Date(st);en.setDate(en.getDate()+6);monthLabel.textContent=st.getMonth()===en.getMonth()?`${st.getFullYear()}年${st.getMonth()+1}月`:`${st.getFullYear()}年${st.getMonth()+1}月〜${en.getMonth()+1}月`;let w=['日','月','火','水','木','金','土'],h='';for(let j=0;j<7;j++){let d=new Date(st);d.setDate(st.getDate()+j);let ds=ymd(d),a=data.items.filter(x=>x.type==='event'&&x.date===ds).sort(sortTime);h+=`<div class="weekrow ${j===0?'sun':j===6?'sat':''} ${ds===TODAY?'todayweek':''}"><div class="weekdate">${d.getDate()}[${w[j]}]</div>`;if(!a.length)h+='<div class="weekempty">予定なし</div>';else a.forEach(x=>{let tm=x.allDay?'終日':(x.time||'');let idx=data.items.indexOf(x),attr=x.source==='google'?` title="Googleカレンダー（${x.project}）"`:` data-edit="${idx}"`;h+=`<div class="weekevent ${x.source==='google'?'google':'local'} cat-${x.project||'TOSHI'}"${attr}><div class="weektime">${tm}</div><div class="weektitle">${x.title}${x.source==='google'?`<div class="muted">${x.project}</div>`:''}</div></div>`});h+='</div>'}weekList.innerHTML=h}
function showDay(s){selected=s;selectedTitle.textContent=s+' の予定';let a=data.items.map((x,i)=>[x,i]).filter(([x])=>x.date===s||x.end===s).sort((a,b)=>sortTime(a[0],b[0])),m=data.money.map((x,i)=>[x,i]).filter(([x])=>x.date===s);selectedRows.innerHTML=(a.map(([x,i])=>itemRow(x,i)).join('')+m.map(([x,i])=>moneyRow(x,i)).join(''))||'<div class="muted">登録なし</div>'}
function projectBarClass(p){return p==='CPG'?'gbar-cpg':p==='TASK'?'gbar-task':p==='Trip'?'gbar-trip':p==='GOLF'?'gbar-golf':'gbar-toshi'}
function renderGantt(){
 let p=projectFilter.value;
 let a=data.items.filter(x=>x.type==='todo'&&!x.done&&x.start&&(p==='すべて'||x.project===p)).slice(0,20),
 base=new Date();base.setHours(0,0,0,0),h='<div></div>';
 for(let j=0;j<14;j++){let d=new Date(base);d.setDate(d.getDate()+j);h+=`<div class="dow">${d.getMonth()+1}/${d.getDate()}</div>`}
 if(!a.length){ganttGrid.innerHTML=h+'<div class="gn">未完了のToDoはありません</div>';return}
 a.forEach(x=>{
   h+=`<div class="gn">${x.title}<div class="muted">${x.project||''}</div></div>`;
   let st=new Date(x.start+'T00:00:00'),en=new Date((x.end||x.start)+'T00:00:00');
   for(let j=0;j<14;j++){let d=new Date(base);d.setDate(d.getDate()+j);h+=`<div class="gc">${d>=st&&d<=en?`<div class="bar ${projectBarClass(x.project)}"></div>`:''}</div>`}
 });
 ganttGrid.innerHTML=h
}
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');renderTodos()});document.addEventListener('click',e=>{let b=e.target.closest('[data-toggle]');if(b){data.items[+b.dataset.toggle].done=!data.items[+b.dataset.toggle].done;save()}let m=e.target.closest('[data-money]');if(m){data.money[+m.dataset.money].done=!data.money[+m.dataset.money].done;save()}let d=e.target.closest('[data-day]');if(d)showDay(d.dataset.day)});
prev.onclick=()=>{if(calendarMode==='week'){weekAnchor.setDate(weekAnchor.getDate()-7)}else view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()};next.onclick=()=>{if(calendarMode==='week'){weekAnchor.setDate(weekAnchor.getDate()+7)}else view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()};monthViewBtn.onclick=()=>{calendarMode='month';monthViewBtn.classList.add('sel');weekViewBtn.classList.remove('sel');renderCal()};weekViewBtn.onclick=()=>{calendarMode='week';weekViewBtn.classList.add('sel');monthViewBtn.classList.remove('sel');renderCal()};projectFilter.onchange=renderGantt;plus.onclick=()=>{modal.style.display='flex';eventDate.value=todoStart.value=todoEnd.value=moneyDate.value=TODAY};close.onclick=()=>modal.style.display='none';allDay.onchange=()=>eventTimes.style.display=allDay.checked?'none':'grid';
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{entry=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');eventFields.style.display=entry==='event'?'block':'none';todoFields.style.display=entry==='todo'?'block':'none';moneyFields.style.display=entry==='money'?'block':'none'});
form.onsubmit=e=>{e.preventDefault();let t=title.value.trim();if(!t)return;if(entry==='event')data.items.unshift({title:t,type:'event',date:eventDate.value,time:allDay.checked?'':startTime.value,endTime:allDay.checked?'':endTime.value,allDay:allDay.checked,project:eventProject.value,done:false});else if(entry==='todo')data.items.unshift({title:t,type:'todo',start:todoStart.value,end:todoEnd.value,deadlineTime:deadlineTime.value,project:todoProject.value,done:false});else data.money.unshift({title:t,amount:Number(amount.value||0),date:moneyDate.value,time:moneyTime.value,kind:moneyKind.value,done:false});title.value='';save();modal.style.display='none';show(entry==='money'?'money':entry==='todo'?'todos':'calendar')};
let editingIndex=-1;
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-edit]');
 if(!b)return;
 editingIndex=+b.dataset.edit;
 const x=data.items[editingIndex];
 if(!x||x.source==='google')return;
 editTitle.value=x.title||'';editDate.value=x.date||TODAY;editAllDay.checked=!!x.allDay;
 editStartTime.value=x.time||'';editEndTime.value=x.endTime||'';editProject.value=['TOSHI','CPG','TASK','Trip','GOLF'].includes(x.project)?x.project:'TOSHI';
 editTimes.style.display=editAllDay.checked?'none':'grid';
 editModal.style.display='flex';
});
editAllDay.onchange=()=>editTimes.style.display=editAllDay.checked?'none':'grid';
editClose.onclick=()=>editModal.style.display='none';
editDelete.onclick=()=>{if(editingIndex<0)return;const x=data.items[editingIndex];if(!x||x.source==='google'){alert('Googleカレンダーの予定はGoogle側で削除してください');return;}if(confirm('この予定を削除しますか？')){data.items.splice(editingIndex,1);save();editModal.style.display='none';editingIndex=-1;}};
editForm.onsubmit=e=>{
 e.preventDefault();
 if(editingIndex<0)return;
 const x=data.items[editingIndex];
 x.title=editTitle.value.trim();x.date=editDate.value;x.allDay=editAllDay.checked;
 x.time=editAllDay.checked?'':editStartTime.value;x.endTime=editAllDay.checked?'':editEndTime.value;
 x.project=editProject.value;
 save();editModal.style.display='none';editingIndex=-1;
};

nami.onclick=()=>location.href='https://chatgpt.com/';
calendarMode='week';
weekViewBtn.classList.add('sel');
monthViewBtn.classList.remove('sel');
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
